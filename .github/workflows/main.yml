name: Build DEJA Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install required Android SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Check project structure
        run: |
          test -f DEJA_Android_Project/settings.gradle.kts
          test -f DEJA_Android_Project/build.gradle.kts
          test -f DEJA_Android_Project/app/build.gradle.kts

      - name: Build DEJA debug APK
        working-directory: DEJA_Android_Project
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK was created
        run: |
          APK=$(find DEJA_Android_Project/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$APK"
          test -s "$APK"
          echo "APK created: $APK"
          ls -lh "$APK"

      - name: Upload DEJA APK
        uses: actions/upload-artifact@v4
        with:
          name: DEJA-Android-APK
          path: DEJA_Android_Project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

