name: Build DEJA Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'DEJA_Android_Project/**'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK components
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build DEJA
        working-directory: DEJA_Android_Project
        run: gradle --no-daemon assembleDebug

      - name: Upload DEJA APK
        uses: actions/upload-artifact@v4
        with:
          name: DEJA-debug-apk
          path: DEJA_Android_Project/app/build/outputs/apk/debug/*.apk
